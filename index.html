<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>simpleclips.</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#feed {
  height: 100vh;
  width: 100vw;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

#feed::-webkit-scrollbar {
  display: none;
}

.slide {
  height: 100vh;
  width: 100vw;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #000;
  overflow: hidden;
}

.slide video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  background: #000;
  cursor: pointer;
}

#soundOverlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  cursor: pointer;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}

#soundOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.soundCard {
  width: min(90vw, 420px);
  padding: 32px 28px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 24px;
  background: rgba(25, 25, 25, 0.75);
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
}

.soundIcon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: #000;
  font-size: 34px;
}

.soundTitle {
  color: #fff;
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 8px;
}

.soundText {
  color: rgba(255, 255, 255, 0.65);
  font-size: 14px;
}

#pauseIndicator {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(.9);
  width: 86px;
  height: 86px;
  border-radius: 50%;
  background: rgba(0, 0, 0, .58);
  border: 1px solid rgba(255, 255, 255, .2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 40;
  pointer-events: none;
  animation: indicatorIn .15s ease forwards;
}

#pauseIndicator.visible {
  display: flex;
}

.pause-bars {
  display: flex;
  gap: 8px;
}

.pause-bars div {
  width: 9px;
  height: 31px;
  border-radius: 3px;
  background: #fff;
}

.play-triangle {
  width: 0;
  height: 0;
  border-top: 16px solid transparent;
  border-bottom: 16px solid transparent;
  border-left: 24px solid #fff;
  margin-left: 5px;
}

@keyframes indicatorIn {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.75);
  }

  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

#logo {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 13px 9px 9px;
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 15px;
  background: rgba(15, 15, 15, .55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #fff;
  user-select: none;
  pointer-events: none;
}

.logo-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: #000;
  font-weight: 900;
  font-size: 17px;
}

.logo-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.3px;
}

.logo-name span {
  opacity: .55;
}

#status {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: #888;
  font-size: 12px;
  z-index: 10;
}

#errorBox {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  color: #ff6b6b;
  font-size: 14px;
  padding: 24px;
  text-align: center;
  z-index: 60;
}

@media (max-width: 600px) {
  .slide,
  #feed {
    height: 100svh;
  }

  .slide video {
    height: 100%;
    width: 100%;
    object-position: center center;
  }
}

@supports (height: 100dvh) {
  @media (max-width: 600px) {
    .slide,
    #feed {
      height: 100dvh;
    }
  }
}
</style>
</head>

<body>

<div id="feed"></div>

<div id="soundOverlay">
  <div class="soundCard">
    <div class="soundIcon">🔊</div>
    <div class="soundTitle">Enable sound</div>
    <div class="soundText">
      Click anywhere to enable sound and start watching
    </div>
  </div>
</div>

<div id="pauseIndicator">
  <div id="indicatorContent"></div>
</div>

<div id="logo">
  <div class="logo-icon">S</div>
  <div class="logo-name">simple<span>clips.</span></div>
</div>

<div id="status">loading…</div>
<div id="errorBox"></div>

<script>
const feed = document.getElementById("feed");
const status = document.getElementById("status");
const errorBox = document.getElementById("errorBox");
const soundOverlay = document.getElementById("soundOverlay");
const pauseIndicator = document.getElementById("pauseIndicator");
const indicatorContent = document.getElementById("indicatorContent");

let maxId = null;
let pinnedInstance = null;
let loading = false;
let noMoreData = false;
let soundEnabled = false;
let activeSlide = null;

const seenClips = new Set();

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "flex";
  status.style.display = "none";
}

function showPauseIndicator(paused) {
  indicatorContent.innerHTML = "";

  if (paused) {
    const bars = document.createElement("div");
    bars.className = "pause-bars";

    bars.appendChild(document.createElement("div"));
    bars.appendChild(document.createElement("div"));

    indicatorContent.appendChild(bars);
  } else {
    const triangle = document.createElement("div");
    triangle.className = "play-triangle";
    indicatorContent.appendChild(triangle);
  }

  pauseIndicator.classList.remove("visible");

  void pauseIndicator.offsetWidth;

  pauseIndicator.classList.add("visible");

  clearTimeout(window.indicatorTimeout);

  window.indicatorTimeout = setTimeout(() => {
    pauseIndicator.classList.remove("visible");
  }, 650);
}

function enableSound() {
  soundEnabled = true;
  soundOverlay.classList.add("hidden");

  if (!activeSlide) {
    activeSlide = feed.querySelector(".slide");
  }

  if (!activeSlide) return;

  const video = activeSlide.querySelector("video");

  if (!video) return;

  video.muted = false;

  if (video.paused) {
    video.play().catch(() => {});
  }
}

soundOverlay.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  enableSound();
});

async function fetchClips() {
  if (loading || noMoreData) return;

  loading = true;
  status.style.display = "block";

  try {
    const params = new URLSearchParams();

    if (maxId) {
      params.set("maxId", maxId);
    }

    if (pinnedInstance) {
      params.set("instance", pinnedInstance);
    }

    const response = await fetch(
      `/api/mastodon?${params.toString()}`
    );

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        `Server returned: ${text.slice(0, 150)}`
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Failed to fetch clips"
      );
    }

    pinnedInstance = data.instance;
    maxId = data.nextMaxId;

    const clips = data.clips || [];

    const newClips = clips.filter((clip) => {
      if (!clip.id || seenClips.has(clip.id)) {
        return false;
      }

      seenClips.add(clip.id);
      return true;
    });

    if (newClips.length === 0) {
      if (maxId) {
        loading = false;
        await fetchClips();
        return;
      }

      noMoreData = true;
      loading = false;
      status.style.display = "none";
      return;
    }

    newClips.forEach(addSlide);
  } catch (error) {
    console.error(error);
    showError("Network error: " + error.message);
  }

  loading = false;
  status.style.display = "none";
}

function addSlide(clip) {
  const slide = document.createElement("div");
  slide.className = "slide";

  const video = document.createElement("video");

  video.src = clip.url;
  video.loop = true;
  video.muted = !soundEnabled;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.preload = "metadata";

  slide.appendChild(video);
  feed.appendChild(slide);

  observer.observe(slide);

  slide.addEventListener("click", (event) => {
    event.stopPropagation();

    if (video.paused) {
      video.muted = false;

      video.play()
        .then(() => {
          showPauseIndicator(false);
        })
        .catch(() => {});
    } else {
      video.pause();
      showPauseIndicator(true);
    }
  });
}

const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector("video");

      if (!video) return;

      if (entry.isIntersecting) {
        activeSlide = entry.target;

        video.muted = !soundEnabled;

        video.play().catch(() => {});
      } else {
        video.pause();

        if (activeSlide === entry.target) {
          activeSlide = null;
        }
      }
    });
  },
  {
    threshold: 0.6
  }
);

feed.addEventListener("scroll", () => {
  if (
    feed.scrollTop + feed.clientHeight >=
    feed.scrollHeight - window.innerHeight * 2
  ) {
    fetchClips();
  }
});

fetchClips();
</script>

</body>
</html>
