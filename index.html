<body>

<div id="feed"></div>

<div id="logo">
  <div class="logo-mark">S</div>
  <div class="logo-text">simple<span>clips.</span></div>
</div>

<div id="status">loading…</div>

<div id="errorBox"></div>

<script>
const feed = document.getElementById('feed');
const status = document.getElementById('status');
const errorBox = document.getElementById('errorBox');

let maxId = null;
let pinnedInstance = null;
let loading = false;
let noMoreData = false;

const seenClips = new Set();

let soundEnabled = false;

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'flex';
  status.style.display = 'none';
}

async function fetchClips() {
  if (loading || noMoreData) return;

  loading = true;
  status.style.display = 'block';

  try {
    const params = new URLSearchParams();

    if (maxId) {
      params.set('maxId', maxId);
    }

    if (pinnedInstance) {
      params.set('instance', pinnedInstance);
    }

    const url = `/api/mastodon?${params.toString()}`;

    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) {
      console.error('Mastodon fetch failed:', data);
      showError(`Error fetching clips: ${JSON.stringify(data)}`);
      loading = false;
      return;
    }

    pinnedInstance = data.instance;

    const clips = data.clips || [];

    maxId = data.nextMaxId || null;

    const newClips = clips.filter(clip => {
      if (!clip.id || seenClips.has(clip.id)) {
        return false;
      }

      seenClips.add(clip.id);
      return true;
    });

    if (newClips.length === 0) {
      if (maxId && maxId !== data.previousMaxId) {
        loading = false;
        await fetchClips();
        return;
      }

      noMoreData = true;
      status.style.display = 'none';
      loading = false;
      return;
    }

    newClips.forEach(addSlide);

  } catch (e) {
    console.error(e);
    showError('Network error: ' + e.message);
  }

  loading = false;
  status.style.display = 'none';
}

function createSoundIndicator(slide) {
  const indicator = document.createElement('div');
  indicator.className = 'sound-indicator';
  indicator.textContent = soundEnabled ? '🔊' : '🔇';

  slide.appendChild(indicator);

  return indicator;
}

function createPauseIndicator(slide) {
  const indicator = document.createElement('div');
  indicator.className = 'pause-indicator';

  slide.appendChild(indicator);

  return indicator;
}

function showSoundIndicator(indicator) {
  indicator.classList.add('show');

  clearTimeout(indicator.hideTimeout);

  indicator.hideTimeout = setTimeout(() => {
    indicator.classList.remove('show');
  }, 700);
}

function showPauseIndicator(indicator, paused) {
  indicator.classList.remove('playing', 'paused');

  if (paused) {
    indicator.classList.add('paused', 'show');
  } else {
    indicator.classList.add('playing', 'show');

    clearTimeout(indicator.hideTimeout);

    indicator.hideTimeout = setTimeout(() => {
      indicator.classList.remove('show');
    }, 500);
  }
}

function addSlide(clip) {
  const slide = document.createElement('div');
  slide.className = 'slide';

  const video = document.createElement('video');

  video.src = clip.url;
  video.loop = true;
  video.muted = !soundEnabled;
  video.playsInline = true;
  video.preload = 'metadata';

  slide.appendChild(video);

  const soundIndicator = createSoundIndicator(slide);
  const pauseIndicator = createPauseIndicator(slide);

  feed.appendChild(slide);

  observer.observe(slide);

  slide.addEventListener('click', async () => {
    if (video.paused) {
      try {
        await video.play();
        showPauseIndicator(pauseIndicator, false);
      } catch (e) {
        console.warn('Video playback failed:', e);
      }

      return;
    }

    video.pause();
    showPauseIndicator(pauseIndicator, true);
  });

  video.addEventListener('ended', () => {
    if (video.loop) {
      video.currentTime = 0;
      video.play().catch(() => {});
    }
  });

  slide.addEventListener('dblclick', (event) => {
    event.preventDefault();
  });
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(async (entry) => {
    const video = entry.target.querySelector('video');
    const pauseIndicator = entry.target.querySelector('.pause-indicator');

    if (!video) return;

    if (entry.isIntersecting) {
      video.muted = !soundEnabled;

      try {
        await video.play();
        pauseIndicator.classList.remove('show');
      } catch (e) {
        video.muted = true;

        try {
          await video.play();
          pauseIndicator.classList.remove('show');
        } catch (e2) {}
      }
    } else {
      video.pause();
      pauseIndicator.classList.remove('show');
    }
  });
}, {
  threshold: 0.6
});

feed.addEventListener('scroll', () => {
  if (
    feed.scrollTop + feed.clientHeight >=
    feed.scrollHeight - window.innerHeight * 2
  ) {
    fetchClips();
  }
});

fetchClips();
</script>

</body>
