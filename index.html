<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>simplemedal.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
  }
  #feed {
    height: 100vh;
    width: 100vw;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  .slide {
    height: 100vh;
    width: 100vw;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
  }
  .slide iframe {
    height: 100%;
    width: 100%;
    border: none;
  }
  #feed::-webkit-scrollbar { display: none; }
  #feed { -ms-overflow-style: none; scrollbar-width: none; }
  #status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 12px;
    z-index: 10;
  }
  #errorBox {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ff6b6b;
    font-size: 14px;
    padding: 24px;
    text-align: center;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="feed"></div>
<div id="status">loading…</div>
<div id="errorBox"></div>

<script>
  // Category IDs per Medal's /v1/categories endpoint. 0 = All games.
  const CATEGORY_ID = 0;

  const feed = document.getElementById('feed');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');

  let apiKey = null;
  let offset = 0;
  let loading = false;
  let noMoreData = false;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'flex';
    status.style.display = 'none';
  }

  async function init() {
    try {
      const keyRes = await fetch('https://developers.medal.tv/v1/generate_public_key', {
        method: 'POST'
      });
      const keyText = await keyRes.text();
      console.log('Raw key response:', keyText);

      let parsedKey;
      try {
        const parsed = JSON.parse(keyText);
        parsedKey = parsed.publicKey || parsed.data || parsed.key || keyText;
      } catch {
        parsedKey = keyText.replace(/"/g, '').trim();
      }
      apiKey = parsedKey;
      console.log('Using API key:', apiKey);

      if (!apiKey || apiKey.length < 5) {
        showError('Could not generate a Medal API key. Medal\'s API may have changed or be temporarily unavailable. Raw response: ' + keyText);
        return;
      }

      fetchClips();
    } catch (e) {
      console.error(e);
      showError('Could not reach Medal\'s API to generate a key: ' + e.message);
    }
  }

  async function fetchClips() {
    if (loading || noMoreData || !apiKey) return;
    loading = true;
    status.style.display = 'block';

    try {
      const url = `https://developers.medal.tv/v1/trending?categoryId=${CATEGORY_ID}&limit=10&offset=${offset}`;
      const res = await fetch(url, {
        headers: { 'Authorization': apiKey }
      });

      if (!res.ok) {
        const bodyText = await res.text();
        console.error('Trending fetch failed:', res.status, bodyText);
        showError(`Medal API error (${res.status}). Key used: ${apiKey}. Response: ${bodyText}`);
        loading = false;
        return;
      }

      const data = await res.json();
      const clips = data.contentObjects || [];

      if (clips.length === 0) {
        noMoreData = true;
      } else {
        clips.forEach(addSlide);
        offset += clips.length;
      }
    } catch (e) {
      showError('Network error reaching Medal\'s API.');
    }

    loading = false;
    status.style.display = 'none';
  }

  function extractSrc(embedIframeUrl) {
    const match = embedIframeUrl && embedIframeUrl.match(/src=['"]([^'"]+)['"]/);
    return match ? match[1] : null;
  }

  function addSlide(clip) {
    const rawSrc = extractSrc(clip.embedIframeUrl);
    if (!rawSrc) return;

    // force no cta overlay, no loop-forced-autoplay until in view
    const url = new URL(rawSrc);
    url.searchParams.set('cta', '0');
    url.searchParams.set('autoplay', '0');
    url.searchParams.set('loop', '1');

    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.src = url.toString();

    feed.appendChild(slide);
    observer.observe(slide);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const slide = entry.target;
      if (entry.isIntersecting) {
        if (!slide.querySelector('iframe')) {
          const iframe = document.createElement('iframe');
          iframe.src = slide.dataset.src;
          iframe.allow = 'autoplay; encrypted-media';
          iframe.allowFullscreen = true;
          slide.appendChild(iframe);
        }
      } else {
        // unload iframe when scrolled away to stop playback
        const iframe = slide.querySelector('iframe');
        if (iframe) iframe.remove();
      }
    });
  }, { threshold: 0.6 });

  // infinite scroll
  feed.addEventListener('scroll', () => {
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - window.innerHeight * 2) {
      fetchClips();
    }
  });

  init();
</script>

</body>
</html>
