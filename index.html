<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>simpleclips.</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#feed {
  width: 100vw;
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  overscroll-behavior-y: contain;
}

#feed::-webkit-scrollbar {
  display: none;
}

#feed {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.slide {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.slide video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  user-select: none;
  -webkit-user-select: none;
}

#status {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 50;
  color: rgba(255, 255, 255, 0.55);
  font-size: 12px;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

#errorBox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
  color: #fff;
  background: #000;
  text-align: center;
  font-size: 14px;
}

#logo {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 12px 7px 7px;
  border-radius: 15px;
  background: rgba(18, 18, 22, 0.62);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  pointer-events: none;
  user-select: none;
}

.logo-icon {
  position: relative;
  width: 27px;
  height: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: linear-gradient(145deg, #ffffff, #bcbcc2);
  color: #111;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: -1px;
  box-shadow:
    0 3px 10px rgba(0, 0, 0, 0.3),
    inset 0 1px 1px rgba(255, 255, 255, 0.8);
}

.logo-icon::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  right: 4px;
  top: 4px;
  border-radius: 50%;
  background: #111;
  opacity: 0.18;
}

.logo-name {
  color: #fff;
  font-size: 13px;
  line-height: 1;
  font-weight: 750;
  letter-spacing: -0.45px;
  white-space: nowrap;
}

.logo-name span {
  opacity: 0.5;
  font-weight: 500;
}

.pause-indicator {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 100px;
  height: 100px;
  transform: translate(-50%, -50%) scale(0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.7);
  border: 2px solid rgba(255, 255, 255, 0.28);
  box-shadow:
    0 12px 45px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.16s ease,
    transform 0.16s ease;
}

.pause-indicator.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.pause-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
}

.pause-icon::before,
.pause-icon::after {
  content: "";
  width: 10px;
  height: 38px;
  border-radius: 4px;
  background: #fff;
}

.pause-icon::before {
  margin-right: 7px;
}

.pause-icon::after {
  margin-left: 7px;
}

.play-icon {
  width: 0;
  height: 0;
  margin-left: 8px;
  border-top: 22px solid transparent;
  border-bottom: 22px solid transparent;
  border-left: 34px solid #fff;
}

.play-indicator {
  animation: indicatorPop 0.18s ease-out;
}

@keyframes indicatorPop {
  from {
    transform: translate(-50%, -50%) scale(0.65);
  }

  to {
    transform: translate(-50%, -50%) scale(1);
  }
}

.loading-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 42px;
  margin: -21px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-top-color: rgba(255, 255, 255, 0.9);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
  pointer-events: none;
}

.loading-ring.show {
  display: block;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 600px) {
  #logo {
    right: 12px;
    bottom: 12px;
    padding: 6px 10px 6px 6px;
    border-radius: 13px;
  }

  .logo-icon {
    width: 25px;
    height: 25px;
  }

  .logo-name {
    font-size: 12px;
  }

  .pause-indicator {
    width: 88px;
    height: 88px;
  }
}
</style>
</head>

<body>

<div id="feed"></div>

<div id="logo">
  <div class="logo-icon">S</div>
  <div class="logo-name">simple<span>clips.</span></div>
</div>

<div id="status">loading…</div>

<div id="errorBox"></div>

<script>
const feed = document.getElementById("feed");
const status = document.getElementById("status");
const errorBox = document.getElementById("errorBox");

let maxId = null;
let pinnedInstance = null;
let loading = false;
let noMoreData = false;

const seenClips = new Set();

let soundEnabled = true;
let userHasInteracted = false;

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "flex";
  status.style.display = "none";
}

function createPauseIndicator(slide) {
  const indicator = document.createElement("div");
  indicator.className = "pause-indicator";

  const icon = document.createElement("div");
  icon.className = "pause-icon";

  indicator.appendChild(icon);
  slide.appendChild(indicator);

  return indicator;
}

function showPausedIndicator(indicator) {
  indicator.innerHTML = "";

  const icon = document.createElement("div");
  icon.className = "pause-icon";

  indicator.appendChild(icon);
  indicator.classList.remove("play-indicator");
  indicator.classList.add("show");
}

function showPlayingIndicator(indicator) {
  indicator.innerHTML = "";

  const icon = document.createElement("div");
  icon.className = "play-icon";

  indicator.appendChild(icon);

  indicator.classList.remove("show");
  void indicator.offsetWidth;
  indicator.classList.add("play-indicator", "show");

  clearTimeout(indicator.timeout);

  indicator.timeout = setTimeout(() => {
    indicator.classList.remove("show", "play-indicator");
  }, 500);
}

function hideIndicator(indicator) {
  indicator.classList.remove("show", "play-indicator");
}

async function playVideo(video, indicator) {
  video.muted = !soundEnabled;

  try {
    await video.play();
    hideIndicator(indicator);
    return true;
  } catch (error) {
    if (soundEnabled && !userHasInteracted) {
      video.muted = true;

      try {
        await video.play();
        return true;
      } catch (fallbackError) {
        console.warn("Autoplay failed:", fallbackError);
        return false;
      }
    }

    console.warn("Video playback failed:", error);
    return false;
  }
}

async function enableSoundAndPlayCurrent() {
  userHasInteracted = true;
  soundEnabled = true;

  const activeSlide = document.querySelector(".slide.active");

  if (!activeSlide) return;

  const video = activeSlide.querySelector("video");

  if (!video) return;

  video.muted = false;

  try {
    await video.play();
  } catch (error) {
    console.warn("Could not start audio:", error);
  }
}

async function fetchClips() {
  if (loading || noMoreData) return;

  loading = true;
  status.style.display = "block";

  try {
    const params = new URLSearchParams();

    if (maxId) {
      params.set("maxId", maxId);
    }

    if (pinnedInstance) {
      params.set("instance", pinnedInstance);
    }

    const response = await fetch(`/api/mastodon?${params.toString()}`);
    const data = await response.json();

    if (!response.ok) {
      console.error("Mastodon API error:", data);
      showError("Error fetching clips.");
      loading = false;
      return;
    }

    pinnedInstance = data.instance;

    const clips = Array.isArray(data.clips)
      ? data.clips
      : [];

    const previousMaxId = maxId;
    maxId = data.nextMaxId || null;

    const newClips = clips.filter(clip => {
      if (!clip.id) return false;

      if (seenClips.has(clip.id)) {
        return false;
      }

      seenClips.add(clip.id);
      return true;
    });

    newClips.forEach(addSlide);

    if (
      newClips.length === 0 &&
      maxId &&
      maxId !== previousMaxId
    ) {
      loading = false;
      await fetchClips();
      return;
    }

    if (!maxId || clips.length === 0) {
      noMoreData = true;
    }

  } catch (error) {
    console.error(error);
    showError("Network error: " + error.message);
  }

  loading = false;
  status.style.display = "none";
}

function addSlide(clip) {
  const slide = document.createElement("div");
  slide.className = "slide";

  const video = document.createElement("video");

  video.src = clip.url;
  video.loop = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.muted = !soundEnabled;

  slide.appendChild(video);

  const pauseIndicator = createPauseIndicator(slide);

  feed.appendChild(slide);

  observer.observe(slide);

  slide.addEventListener("click", async () => {
    userHasInteracted = true;

    if (video.paused) {
      soundEnabled = true;
      video.muted = false;

      const played = await playVideo(video, pauseIndicator);

      if (played) {
        showPlayingIndicator(pauseIndicator);
      }

      return;
    }

    video.pause();
    showPausedIndicator(pauseIndicator);
  });

  video.addEventListener("waiting", () => {
    if (!video.paused) {
      video.classList.add("buffering");
    }
  });

  video.addEventListener("playing", () => {
    video.classList.remove("buffering");
  });

  video.addEventListener("error", () => {
    console.warn("Video failed to load:", clip.url);
  });
}

const observer = new IntersectionObserver(async entries => {
  for (const entry of entries) {
    const slide = entry.target;
    const video = slide.querySelector("video");
    const pauseIndicator = slide.querySelector(".pause-indicator");

    if (!video) continue;

    if (entry.isIntersecting) {
      document.querySelectorAll(".slide.active").forEach(other => {
        if (other !== slide) {
          other.classList.remove("active");

          const otherVideo = other.querySelector("video");

          if (otherVideo) {
            otherVideo.pause();
          }
        }
      });

      slide.classList.add("active");

      const played = await playVideo(video, pauseIndicator);

      if (played) {
        hideIndicator(pauseIndicator);
      }

    } else {
      video.pause();
      hideIndicator(pauseIndicator);
      slide.classList.remove("active");
    }
  }
}, {
  threshold: 0.65
});

feed.addEventListener("scroll", () => {
  if (
    feed.scrollTop + feed.clientHeight >=
    feed.scrollHeight - window.innerHeight * 2
  ) {
    fetchClips();
  }
});

document.addEventListener("pointerdown", () => {
  enableSoundAndPlayCurrent();
}, {
  once: true,
  passive: true
});

document.addEventListener("keydown", () => {
  enableSoundAndPlayCurrent();
}, {
  once: true
});

fetchClips();
</script>

</body>
</html>
