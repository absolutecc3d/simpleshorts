<div id="feed"></div>

<div id="soundBanner">
  <span class="sound-icon">🔊</span>
  <span>Click anywhere to enable sound</span>
</div>

<div id="pauseIndicator">
  <div id="indicatorContent"></div>
</div>

<div id="logo">
  <div class="logo-icon">S</div>
  <div class="logo-name">simple<span>clips.</span></div>
</div>

<div id="status">loading…</div>
<div id="errorBox"></div>

<script>
const feed = document.getElementById("feed");
const status = document.getElementById("status");
const errorBox = document.getElementById("errorBox");
const soundBanner = document.getElementById("soundBanner");
const pauseIndicator = document.getElementById("pauseIndicator");
const indicatorContent = document.getElementById("indicatorContent");

let maxId = null;
let pinnedInstance = null;
let loading = false;
let noMoreData = false;
let soundEnabled = false;
let userHasInteracted = false;
let activeSlide = null;

const seenClips = new Set();

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "flex";
  status.style.display = "none";
}

function hideSoundBanner() {
  soundBanner.classList.add("hidden");
}

function showPauseIndicator(paused) {
  indicatorContent.innerHTML = "";

  if (paused) {
    const bars = document.createElement("div");
    bars.className = "pause-bars";

    const bar1 = document.createElement("div");
    const bar2 = document.createElement("div");

    bars.appendChild(bar1);
    bars.appendChild(bar2);

    indicatorContent.appendChild(bars);
  } else {
    const triangle = document.createElement("div");
    triangle.className = "play-triangle";
    indicatorContent.appendChild(triangle);
  }

  pauseIndicator.classList.remove("visible");

  void pauseIndicator.offsetWidth;

  pauseIndicator.classList.add("visible");

  clearTimeout(window.indicatorTimeout);

  window.indicatorTimeout = setTimeout(() => {
    pauseIndicator.classList.remove("visible");
  }, 650);
}

function enableSound() {
  userHasInteracted = true;
  soundEnabled = true;
  hideSoundBanner();

  if (!activeSlide) return;

  const video = activeSlide.querySelector("video");

  if (!video) return;

  video.muted = false;

  if (video.paused) {
    video.play().catch(() => {});
  }
}

async function fetchClips() {
  if (loading || noMoreData) return;

  loading = true;
  status.style.display = "block";

  try {
    const params = new URLSearchParams();

    if (maxId) {
      params.set("maxId", maxId);
    }

    if (pinnedInstance) {
      params.set("instance", pinnedInstance);
    }

    const url = `/api/mastodon?${params.toString()}`;

    const res = await fetch(url);

    const text = await res.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        `Server returned: ${text.slice(0, 150)}`
      );
    }

    if (!res.ok) {
      console.error("Mastodon fetch failed:", data);

      showError(
        `Error fetching clips: ${
          data.error || JSON.stringify(data)
        }`
      );

      loading = false;
      return;
    }

    pinnedInstance = data.instance;

    const clips = data.clips || [];

    maxId = data.nextMaxId;

    const newClips = clips.filter((clip) => {
      if (!clip.id || seenClips.has(clip.id)) {
        return false;
      }

      seenClips.add(clip.id);

      return true;
    });

    if (newClips.length === 0) {
      if (maxId) {
        loading = false;
        await fetchClips();
        return;
      }

      noMoreData = true;
      loading = false;
      status.style.display = "none";
      return;
    }

    newClips.forEach(addSlide);

  } catch (e) {
    console.error(e);
    showError("Network error: " + e.message);
  }

  loading = false;
  status.style.display = "none";
}

function addSlide(clip) {
  const slide = document.createElement("div");
  slide.className = "slide";

  const video = document.createElement("video");

  video.src = clip.url;
  video.loop = true;
  video.muted = !soundEnabled;
  video.playsInline = true;
  video.preload = "metadata";

  slide.appendChild(video);
  feed.appendChild(slide);

  observer.observe(slide);

  slide.addEventListener("click", () => {
    enableSound();

    if (video.paused) {
      video.muted = false;

      video.play().then(() => {
        showPauseIndicator(false);
      }).catch(() => {});
    } else {
      video.pause();
      showPauseIndicator(true);
    }
  });
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    const video = entry.target.querySelector("video");

    if (!video) return;

    if (entry.isIntersecting) {
      activeSlide = entry.target;

      if (soundEnabled) {
        video.muted = false;
      } else {
        video.muted = true;
      }

      video.play().catch(() => {});

    } else {
      video.pause();

      if (activeSlide === entry.target) {
        activeSlide = null;
      }
    }
  });
}, {
  threshold: 0.6
});

document.addEventListener("pointerdown", () => {
  enableSound();
});

document.addEventListener("keydown", () => {
  enableSound();
});

feed.addEventListener("scroll", () => {
  if (
    feed.scrollTop + feed.clientHeight >=
    feed.scrollHeight - window.innerHeight * 2
  ) {
    fetchClips();
  }
});

fetchClips();
</script>

</body>
