<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplereddit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
  }
  #feed {
    height: 100vh;
    width: 100vw;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  .slide {
    height: 100vh;
    width: 100vw;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
  }
  .slide video {
    height: 100%;
    width: 100%;
    object-fit: contain;
    background: #000;
  }
  #feed::-webkit-scrollbar { display: none; }
  #feed { -ms-overflow-style: none; scrollbar-width: none; }
  #status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 12px;
    z-index: 10;
    display: none;
  }
</style>
</head>
<body>

<div id="feed"></div>
<div id="status">loading…</div>

<script>
  // Edit this list to change what shows up in the feed
  const SUBREDDITS = ["oddlysatisfying", "nextfuckinglevel", "interestingasfuck", "BetterEveryLoop"];

  const feed = document.getElementById('feed');
  const status = document.getElementById('status');

  let afterToken = null;
  let loading = false;
  let noMoreData = false;

  async function fetchBatch() {
    if (loading || noMoreData) return;
    loading = true;
    status.style.display = 'block';

    try {
      const subs = SUBREDDITS.join('+');
      const url = `/api/reddit?subs=${subs}${afterToken ? '&after=' + afterToken : ''}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        console.error('API error:', data.error);
        loading = false;
        status.style.display = 'none';
        return;
      }

      afterToken = data.data.after;
      if (!afterToken) noMoreData = true;

      const posts = data.data.children || [];
      let added = 0;

      posts.forEach(({ data: post }) => {
        const videoUrl = getVideoUrl(post);
        if (videoUrl) {
          addSlide(videoUrl);
          added++;
        }
      });

      // if we got a page with zero usable videos, try again for more
      if (added === 0 && afterToken) {
        loading = false;
        fetchBatch();
        return;
      }
    } catch (e) {
      console.error(e);
    }

    loading = false;
    status.style.display = 'none';
  }

  function getVideoUrl(post) {
    if (post.over_18) return null;

    // native reddit-hosted video
    if (post.is_video && post.media && post.media.reddit_video) {
      return post.media.reddit_video.fallback_url;
    }
    // crossposted reddit video
    if (post.crosspost_parent_list && post.crosspost_parent_list.length) {
      const parent = post.crosspost_parent_list[0];
      if (parent.is_video && parent.media && parent.media.reddit_video) {
        return parent.media.reddit_video.fallback_url;
      }
    }
    // direct mp4 link posts
    if (typeof post.url === 'string' && post.url.endsWith('.mp4')) {
      return post.url;
    }
    return null;
  }

  function addSlide(videoUrl) {
    const slide = document.createElement('div');
    slide.className = 'slide';

    const video = document.createElement('video');
    video.src = videoUrl;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'metadata';

    slide.appendChild(video);
    feed.appendChild(slide);
    observer.observe(slide);

    // tap to toggle mute (and play if paused)
    slide.addEventListener('click', () => {
      if (video.paused) video.play();
      video.muted = !video.muted;
    });
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      if (entry.isIntersecting) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.6 });

  // infinite scroll
  feed.addEventListener('scroll', () => {
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - window.innerHeight * 2) {
      fetchBatch();
    }
  });

  fetchBatch();
</script>

</body>
</html>
